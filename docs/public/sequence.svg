<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="1075" viewBox="0 0 1010 1075" role="img" aria-labelledby="title desc"><title id="title">先开游戏，后授权</title><desc id="desc">KOOK 加载游戏，SDK ready 后按需申请授权。游戏后端换码并建立会话，无 authenticate 步骤。取消授权则保留游戏页面。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4f54d8"/></marker></defs><rect width="1010" height="1075" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" fill="#303440"><rect x="13" y="20" width="204" height="48" rx="8" fill="#eef0ff"/><text x="115" y="50" text-anchor="middle" font-weight="600">KOOK 客户端</text><path d="M115,78 V1005" stroke="#c8cce0" stroke-dasharray="5 5"/><rect x="273" y="20" width="204" height="48" rx="8" fill="#eef0ff"/><text x="375" y="50" text-anchor="middle" font-weight="600">游戏页面 / SDK</text><path d="M375,78 V1005" stroke="#c8cce0" stroke-dasharray="5 5"/><rect x="533" y="20" width="204" height="48" rx="8" fill="#eef0ff"/><text x="635" y="50" text-anchor="middle" font-weight="600">游戏后端</text><path d="M635,78 V1005" stroke="#c8cce0" stroke-dasharray="5 5"/><rect x="793" y="20" width="204" height="48" rx="8" fill="#eef0ff"/><text x="895" y="50" text-anchor="middle" font-weight="600">KOOK 平台服务</text><path d="M895,78 V1005" stroke="#c8cce0" stroke-dasharray="5 5"/><rect x="7" y="89" width="216" height="44" rx="4" fill="#f3f4fa"/><text x="115" y="115" text-anchor="middle" font-size="14">启动前资格校验，创建实例</text><text x="245" y="162" text-anchor="middle" font-size="15">加载游戏与可信启动绑定</text><path d="M115,174 H375" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="226" text-anchor="middle" font-size="15">ready()</text><path d="M375,238 H115" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="290" text-anchor="middle" font-size="15">环境、实例、availableScopes</text><path d="M115,302 H375" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><rect x="267" y="345" width="216" height="44" rx="4" fill="#f3f4fa"/><text x="375" y="371" text-anchor="middle" font-size="14">游戏已运行；按需发起登录</text><text x="505" y="418" text-anchor="middle" font-size="15">创建 state 登录事务</text><path d="M375,430 H635" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="482" text-anchor="middle" font-size="15">session.get({ state, scopes })</text><path d="M375,494 H115" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><rect x="7" y="537" width="216" height="44" rx="4" fill="#f3f4fa"/><text x="115" y="563" text-anchor="middle" font-size="14">按需弹出权限授权；用户同意</text><text x="245" y="610" text-anchor="middle" font-size="15">code / state / scopes / revision</text><path d="M115,622 H375" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="505" y="674" text-anchor="middle" font-size="15">提交 code 与 state</text><path d="M375,686 H635" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="738" text-anchor="middle" font-size="15">换码，获取可信用户 / 上下文</text><path d="M635,750 H895" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="802" text-anchor="middle" font-size="15">服务端凭据与可信数据</text><path d="M895,814 H635" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="505" y="866" text-anchor="middle" font-size="15">建立游戏自己的登录态</text><path d="M635,878 H375" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="930" text-anchor="middle" font-size="15">真实可用后 reportLoadResult</text><path d="M375,942 H115" stroke="#4f54d8" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="1020" width="960" height="35" rx="4" fill="#eef0ff"/><text x="505" y="1044" text-anchor="middle" font-size="15">取消授权 → 返回 cancelled，保留游戏页面 · OAuth 凭据留在游戏后端</text></g></svg>